name: PR Checks

on:
  pull_request:
    branches: [develop, main, master]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Quality and application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: hms_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d hms_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Bootstrap locked dependencies
        run: sh ci/run bootstrap
      - name: Validate dependency metadata
        run: sh ci/run lockfile-check
      - name: Syntax and Django checks
        run: sh ci/run lint
      - name: Settings and import contract
        run: sh ci/run env-check
      - name: Migration integrity
        run: sh ci/run schema-check
      - name: Security checks
        run: sh ci/run security

  docker:
    name: Production Docker proof
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Build and verify production image
        run: sh ci/run docker-proof
